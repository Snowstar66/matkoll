name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Production mode (`next build`, `next start`) requires AI_PROVIDER to be set; the mock only when chosen explicitly.
  AI_PROVIDER: mock
  # The Playwright server's origin; required by `next build` / `next start` in production mode.
  SITE_URL: http://localhost:3100
  # Same version as the `supabase` dev dependency, so generated types match.
  SUPABASE_CLI_VERSION: 2.122.0
  # Mailpit, Auth, the API gateway, Postgres and Storage stay; the rest is not
  # used by tests. Storage (storage-api) holds the latest photo per place: its
  # migration creates a bucket, and the RLS tests and e2e use it (AD-23, AD-26).
  SUPABASE_EXCLUDE: imgproxy,edge-runtime,logflare,vector,supavisor,studio

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager" (pnpm 12.15.0)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Local Supabase (AD-5): generated types must match the schema, then the
  # integration tests run against it. Services the tests do not use are skipped.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x ${{ env.SUPABASE_EXCLUDE }}
      - name: Generated types match the schema
        run: |
          pnpm db:types
          git diff --exit-code src/lib/supabase/database.types.ts
      - run: pnpm db:env
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x ${{ env.SUPABASE_EXCLUDE }}
      # Writes the Supabase URL and keys from `supabase status` to .env.local,
      # which `next build`, `next start` and Playwright read.
      - run: pnpm db:env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
