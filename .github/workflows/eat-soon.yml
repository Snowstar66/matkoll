name: Eat soon

# "Ät snart": once a day around 15:00 Swedish time the app tells every household with notifications on about the
# food in the fridge and freezer that is due today or overdue (per ingredient shelf life). The job signs in as a
# member of each household with the service role (in GitHub only) and calls POST /api/eat-soon/notify with that
# member's session, as the offers job does for the ideas (scripts/eat-soon.ts; the service role never reaches the
# app, AD-4). Nothing due: no notification. GitHub runs schedules only from the default branch.
# Not a required check: it never runs on pull requests.
#
# Off until the repository variable CLOUD_ENABLED is "true" (the same switch as offers.yml and backup.yml). Needs
# the repository variable SITE_URL (public, not a secret); without it the step says so and ends well. No new secrets.
on:
  schedule:
    # In UTC, so one of the two lines is 15:00 in Sweden whatever the clock: 13:00 UTC is 15:00 in summer (CEST),
    # 14:00 UTC is 15:00 in winter (CET). The step below runs only when it is 15 in Sweden, so there is one send a day.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eat-soon
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main' && vars.CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Is it 15:00 in Sweden?
        id: hour
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(TZ=Europe/Stockholm date +%H)
          if [ "$EVENT" = "schedule" ] && [ "$hour" != "15" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 15:00 in Sweden (it is $hour), the other schedule line runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # With CLOUD_ENABLED on, a missing secret is a red run, never a silent skip.
      - name: Check the secrets
        if: steps.hour.outputs.run == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=(SUPABASE_PROJECT_REF)
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing+=(SUPABASE_PUBLISHABLE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            message="CLOUD_ENABLED är på men hemligheterna saknas: ${missing[*]}. Se docs/molnet.md."
            echo "::error title=Ät snart::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]+$ ]]; then
            message="SUPABASE_PROJECT_REF ska vara projektets id (bara a–z och 0–9), inte en adress. Se docs/molnet.md."
            echo "::error title=Ät snart::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.hour.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
        if: steps.hour.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.hour.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.hour.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The log holds codes and counts only (scripts/eat-soon/job.ts).
      - name: Tell the households
        if: steps.hour.outputs.run == 'true'
        timeout-minutes: 10
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          pnpm eat-soon:notify
