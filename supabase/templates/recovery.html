<!doctype html>
<html lang="sv">
  <body style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.5">
    <h2>Nytt lösenord i Matkoll</h2>
    <p>Öppna länken för att välja ett nytt lösenord.</p>
    <p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery">Välj nytt lösenord</a></p>
    <p>Länken gäller i en timme och går att använda en gång.</p>
    <p>Har du inte bett om ett nytt lösenord kan du strunta i det här mejlet.</p>
  </body>
</html>
