<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Matkoll – Hemma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5A85;text-decoration:none}a:hover{color:#1F4468}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F7F4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif; color: #1B2420; box-sizing: border-box">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Hemma</h1>
      <button aria-label="Lägg till vara" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #3E7C62; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button aria-pressed="true" style="height: 100px; padding: 12px; box-sizing: border-box; border-radius: 18px; border: 2px solid #3E7C62; background: #DDEFE5; color: #1B2420; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: space-between">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2.5"></rect><path d="M6 10h12M9 6v2M9 13v3"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 16px; font-weight: 700">Kyl</span>
          <span style="font-size: 13px; color: #2C5E48">12 varor</span>
        </div>
      </button>
      <button aria-pressed="false" style="height: 100px; padding: 12px; box-sizing: border-box; border-radius: 18px; border: 2px solid transparent; background: #DCE9F6; color: #1B2420; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: space-between">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E5A85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"></path><path d="M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 16px; font-weight: 600">Frys</span>
          <span style="font-size: 13px; color: #2E5A85">5 varor</span>
        </div>
      </button>
      <button aria-pressed="false" style="height: 100px; padding: 12px; box-sizing: border-box; border-radius: 18px; border: 2px solid transparent; background: #F1ECE2; color: #1B2420; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: space-between">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E5B3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v3H8z"></path><path d="M7 6h10a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1z"></path><path d="M6 11h12"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 16px; font-weight: 600">Skafferi</span>
          <span style="font-size: 13px; color: #6E5B3E">23 varor</span>
        </div>
      </button>
    </div>
    <button style="height: 52px; padding: 0 14px; border: none; border-radius: 16px; background: #FFFFFF; color: #1B2420; font: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
      <div style="width: 34px; height: 34px; border-radius: 10px; background: #DCE9F6; color: #2E5A85; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      </div>
      <span style="flex: 1; font-size: 16px; font-weight: 600">Fotografera kylen</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A968F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #56635D">Med mängd</h2>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 2px 16px">
      <sc-for list="{{counted}}" as="it" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-top: {{it.border}}">
          <div style="flex: 1; font-size: 16px">{{it.name}}</div>
          <div style="font-size: 15px; color: #56635D">{{it.amount}}</div>
        </div>
      </sc-for>
    </div>
    <h2 style="margin: 12px 4px 0; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #56635D">Finns hemma</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{always}}" as="c" hint-placeholder-count="6">
        <button style="height: 36px; padding: 0 14px; border: none; border-radius: 18px; background: #DDEFE5; color: #2C5E48; font: inherit; font-size: 14px; font-weight: 600">{{c}}</button>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Huvudmeny" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding-bottom: 24px; box-sizing: border-box; background: rgba(255,255,255,0.92); border-top: 1px solid #E3E8E4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6B7872">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Recept</a>
    <a href="#matsedel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6B7872">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Matsedel</a>
    <a href="Lista.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6B7872">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Lista</a>
    <a href="Hemma.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3E7C62">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path><path d="M10 20v-6h4v6"></path></svg>Hemma</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Mjölk', '1 l'],
      ['Smör', '250 g'],
      ['Ägg', '6 st'],
      ['Kycklingfilé', '600 g'],
      ['Parmesan', '150 g'],
      ['Crème fraiche', '2 dl']
    ];
    return {
      counted: rows.map(([name, amount], idx) => ({
        name, amount, border: idx === 0 ? 'none' : '1px solid #EEF1EF'
      })),
      always: ['Senap', 'Ketchup', 'Majonnäs', 'Tomatpuré', 'Sylt', 'Kapris']
    };
  }
}
</script>
</body>
</html>
