<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Matkoll – Inköpslista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5A85;text-decoration:none}a:hover{color:#1F4468}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F7F4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif; color: #1B2420; box-sizing: border-box">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Inköpslista</h1>
    <div style="font-size: 15px; color: #56635D">Vecka 44 · 4 rätter · 5 varor kvar</div>
  </div>
  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #56635D">{{s.name}}</h2>
        <div style="background: #FFFFFF; border-radius: 18px; padding: 2px 14px">
          <sc-for list="{{s.items}}" as="it" hint-placeholder-count="3">
            <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: {{it.border}}; cursor: pointer">
              <input type="checkbox" aria-label="{{it.name}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
              <sc-if value="{{it.done}}" hint-placeholder-val="{{false}}">
                <div style="width: 26px; height: 26px; border-radius: 13px; background: #3E7C62; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                </div>
              </sc-if>
              <sc-if value="{{it.open}}" hint-placeholder-val="{{true}}">
                <div style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #B9C4BE; box-sizing: border-box; flex-shrink: 0"></div>
              </sc-if>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <div style="font-size: 16px; color: {{it.nameColor}}; text-decoration: {{it.deco}}">{{it.name}}</div>
                <div style="font-size: 13px; color: #6B7872">{{it.from}}</div>
              </div>
              <div style="font-size: 15px; color: #56635D">{{it.amount}}</div>
            </label>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <button style="height: 48px; border-radius: 14px; border: 1.5px dashed #B9C4BE; background: transparent; color: #3E7C62; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Lägg till egen vara</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 84px; padding: 12px 20px; background: rgba(245,247,244,0.95)">
    <button style="width: 100%; height: 52px; border-radius: 16px; border: none; background: #3E7C62; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h2l2 10h10l2-7H7"></path><circle cx="10" cy="19" r="1.4"></circle><circle cx="17" cy="19" r="1.4"></circle></svg>Skicka till ICA</button>
  </div>
  <nav aria-label="Huvudmeny" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding-bottom: 24px; box-sizing: border-box; background: rgba(255,255,255,0.92); border-top: 1px solid #E3E8E4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6B7872">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Recept</a>
    <a href="#matsedel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6B7872">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Matsedel</a>
    <a href="Lista.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3E7C62">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Lista</a>
    <a href="Hemma.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6B7872">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path><path d="M10 20v-6h4v6"></path></svg>Hemma</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Frukt och grönt', [
        ['Paprika, röd', 'Kycklinggryta', '1 st', false],
        ['Citron', 'Ugnsbakad lax', '1 st', false],
        ['Färsk basilika', 'Pasta med tomat', '1 kruka', true]
      ]],
      ['Mejeri', [
        ['Matlagningsgrädde', 'Kycklinggryta', '2,5 dl', false],
        ['Crème fraiche', 'Ugnsbakad lax', '2 dl', false]
      ]],
      ['Kött och fisk', [
        ['Laxfilé', 'Ugnsbakad lax', '600 g', false]
      ]]
    ];
    return {
      sections: data.map(([name, items]) => ({
        name,
        items: items.map(([n, from, amount, done], idx) => ({
          name: n, from, amount, done, open: !done,
          nameColor: done ? '#8A968F' : '#1B2420',
          deco: done ? 'line-through' : 'none',
          border: idx === 0 ? 'none' : '1px solid #EEF1EF'
        }))
      }))
    };
  }
}
</script>
</body>
</html>
