<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Matkoll – Recept: Krämig kycklinggryta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5A85;text-decoration:none}a:hover{color:#1F4468}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F7F4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif; color: #1B2420; box-sizing: border-box">
  <div style="height: 260px; background: #DDEFE5; position: relative; display: flex; align-items: center; justify-content: center; color: #4F7A66">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" role="img" aria-label="Receptbild"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4.5"></circle></svg>
    <a href="Main.dc.html" aria-label="Tillbaka till recept" style="position: absolute; top: 52px; left: 16px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); color: #1B2420; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <button aria-label="Ta bort från favoriter" style="position: absolute; top: 52px; right: 16px; width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.9); color: #3E7C62; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
  </div>
  <div style="margin-top: -24px; position: relative; background: #F5F7F4; border-radius: 24px 24px 0 0; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.15">Krämig kycklinggryta</h1>
      <div style="font-size: 15px; color: #56635D">35 min · Från koket.se</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-radius: 14px; padding: 4px">
        <button aria-label="Färre portioner" style="width: 40px; height: 40px; border-radius: 10px; border: none; background: #F0F3F1; color: #1B2420; font: inherit; font-size: 20px">−</button>
        <div style="min-width: 92px; text-align: center; font-size: 15px; font-weight: 600">4 portioner</div>
        <button aria-label="Fler portioner" style="width: 40px; height: 40px; border-radius: 10px; border: none; background: #F0F3F1; color: #1B2420; font: inherit; font-size: 20px">+</button>
      </div>
      <div style="padding: 6px 12px; border-radius: 12px; background: #DDEFE5; color: #2C5E48; font-size: 13px; font-weight: 600">7 av 9 hemma</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 6px 16px">
      <h2 style="margin: 10px 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #56635D">Ingredienser</h2>
      <sc-for list="{{ingredients}}" as="i" hint-placeholder-count="9">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 40px; border-top: {{i.border}}">
          <sc-if value="{{i.home}}" hint-placeholder-val="{{true}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E7C62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Finns hemma"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </sc-if>
          <sc-if value="{{i.missing}}" hint-placeholder-val="{{false}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E5A85" stroke-width="2" role="img" aria-label="Saknas"><circle cx="12" cy="12" r="6"></circle></svg>
          </sc-if>
          <div style="flex: 1; font-size: 16px">{{i.name}}</div>
          <div style="font-size: 15px; color: {{i.amountColor}}">{{i.amount}}</div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 34px; background: rgba(245,247,244,0.95); border-top: 1px solid #E3E8E4; display: flex; gap: 10px">
    <a href="Lista.dc.html" style="flex: 1; height: 52px; border-radius: 16px; background: #3E7C62; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Lägg på matsedeln</a>
    <a href="#laga" style="width: 110px; height: 52px; border-radius: 16px; background: #DCE9F6; color: #234A70; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Laga nu</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Kycklingfilé', '600 g', true],
      ['Matlagningsgrädde', '2,5 dl', false],
      ['Gul lök', '1 st', true],
      ['Vitlöksklyftor', '2 st', true],
      ['Kycklingbuljong', '1 tärning', true],
      ['Paprika, röd', '1 st', false],
      ['Tomatpuré', '2 msk', true],
      ['Ris', '4 dl', true],
      ['Olivolja', 'efter behov', true]
    ];
    return {
      ingredients: rows.map(([name, amount, home], idx) => ({
        name, amount, home, missing: !home,
        amountColor: home ? '#56635D' : '#2E5A85',
        border: idx === 0 ? 'none' : '1px solid #EEF1EF'
      }))
    };
  }
}
</script>
</body>
</html>
